# Description: Docker Compose file to run cheqd-mcp-server
# SYNTAX: docker compose -f docker/docker-compose.yml up --detach

services:
  mcp-server:
    image: ghcr.io/cheqd/mcp-toolkit:production-latest
    container_name: faber
    profiles:
      - server
    ports:
      - '3000:3000'
    restart: on-failure
    env_file:
      - ../env.example
    extra_hosts:
      - 'holder:host-gateway'
    networks:
      mcp-network:
        aliases:
          - faber

  mcp-stdio-server:
    # MUST: Build cheqd mcp-toolkit Docker image for
    # Stdio MCP server for Claude Desktop integration
    # SYNTAX: docker compose -f docker/docker-compose.yml build mcp-stdio-server
    build:
      context: ../
      dockerfile: docker/Dockerfile.mcp
    profiles:
      - stdio
    ports:
      - '3000:3000'
    restart: on-failure
    env_file:
      - ../env.example
    extra_hosts:
      - 'holder:host-gateway'
    networks:
      mcp-network:
        aliases:
          - faber

  # ACA-Py Holder Agent
  acapy-holder:
    build:
      context: .
      dockerfile: Dockerfile.acapy
    container_name: holder
    profiles:
      - demo
    ports:
      - '4001:4001'
      - '4002:4002'
    restart: on-failure
    command: >
      start
        --label Holder
        --inbound-transport http 0.0.0.0 4002
        --outbound-transport http
        --endpoint http://holder:4002
        --admin 0.0.0.0 4001
        --admin-insecure-mode
        --wallet-type askar-anoncreds
        --wallet-name holder
        --wallet-key insecure
        --auto-provision
        --auto-accept-invites
        --auto-accept-requests
        --auto-ping-connection
        --log-level info
        --no-ledger
        --plugin cheqd
        --plugin-config plugin-config.yml
    healthcheck:
      test: curl -s -o /dev/null -w '%{http_code}' "http://localhost:4001/status/live" | grep "200" > /dev/null
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    extra_hosts:
      - 'faber:host-gateway'
      - 'host.docker.internal:host-gateway'
    networks:
      mcp-network:
        aliases:
          - holder
  acapy-issuer:
    build:
      context: .
      dockerfile: Dockerfile.acapy
    container_name: issuer
    profiles:
      - demo
    ports:
      - '3001:3001'
      - '3002:3002'
    restart: on-failure
    command: >
      start
        --label Issuer
        --inbound-transport http 0.0.0.0 3002
        --outbound-transport http
        --endpoint http://issuer:3002
        --admin 0.0.0.0 3001
        --admin-insecure-mode
        --wallet-type askar-anoncreds
        --wallet-name issuer
        --wallet-key insecure
        --auto-provision
        --auto-accept-invites
        --auto-accept-requests
        --auto-ping-connection
        --log-level info
        --no-ledger
        --plugin cheqd
        --plugin-config plugin-config.yml
    healthcheck:
      test: curl -s -o /dev/null -w '%{http_code}' "http://localhost:3001/status/live" | grep "200" > /dev/null
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    extra_hosts:
      - 'faber:host-gateway'
    networks:
      mcp-network:
        aliases:
          - issuer

networks:
  mcp-network:
    name: mcp-network
    driver: bridge
